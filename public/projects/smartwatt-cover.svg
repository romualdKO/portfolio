<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1418"/>
      <stop offset="60%" stop-color="#102026"/>
      <stop offset="100%" stop-color="#142c33"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#11998e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f0a26d" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162930" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1b20" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bgGrad)"/>
  <rect width="1200" height="760" fill="url(#gridPattern)"/>

  <!-- Energy Wave Lines in background -->
  <path d="M 0 520 Q 200 480 400 530 T 800 500 T 1200 470" fill="none" stroke="rgba(56, 239, 125, 0.15)" stroke-width="2"/>
  <path d="M 0 550 Q 250 490 500 560 T 950 510 T 1200 520" fill="none" stroke="rgba(240, 162, 109, 0.12)" stroke-width="1.5"/>

  <!-- Center Decorative Glow Circle -->
  <circle cx="600" cy="380" r="280" fill="none" stroke="rgba(56,239,125,0.06)" stroke-width="2"/>
  <circle cx="600" cy="380" r="220" fill="none" stroke="rgba(240,162,109,0.05)" stroke-width="1" stroke-dasharray="6,6"/>

  <!-- Main SmartWatt Interactive Mockup Card -->
  <g filter="url(#dropShadow)" transform="translate(180, 110)">
    <!-- Main Shell -->
    <rect width="840" height="520" rx="16" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Header bar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 824 0 C 832.84 0 840 7.16 840 16 L 840 54 L 0 54 Z" fill="rgba(10,18,22,0.85)"/>
    <circle cx="32" cy="27" r="6" fill="#ff5f56"/>
    <circle cx="52" cy="27" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="27" r="6" fill="#27c93f"/>
    <text x="110" y="32" fill="#8ca0a8" font-family="monospace" font-size="13" letter-spacing="2">SMARTWATT · IOT ENERGY MONITOR &amp; USSD CONTROLLER</text>
    <rect x="710" y="18" width="100" height="20" rx="10" fill="rgba(56,239,125,0.15)"/>
    <circle cx="724" cy="28" r="4" fill="#38ef7d"/>
    <text x="735" y="32" fill="#38ef7d" font-family="monospace" font-size="11" font-weight="bold">ONLINE</text>

    <!-- Left side: Digital Smart Meter Dashboard -->
    <g transform="translate(40, 85)">
      <!-- Meter Card -->
      <rect width="440" height="395" rx="12" fill="rgba(8,16,20,0.8)" stroke="rgba(56,239,125,0.2)" stroke-width="1"/>

      <text x="30" y="42" fill="#a0b4bc" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">CONSOMMATION TEMPS RÉEL</text>
      <text x="30" y="100" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="bold">2.48 <tspan font-size="20" fill="#38ef7d">kWh</tspan></text>
      
      <!-- Metric badges -->
      <g transform="translate(30, 130)">
        <rect width="115" height="58" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="12" y="24" fill="#7d919a" font-family="sans-serif" font-size="10">TENSION</text>
        <text x="12" y="46" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">231.4 V</text>

        <rect x="130" width="115" height="58" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="142" y="24" fill="#7d919a" font-family="sans-serif" font-size="10">COURANT</text>
        <text x="142" y="46" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">10.7 A</text>

        <rect x="260" width="120" height="58" rx="8" fill="rgba(240,162,109,0.1)" stroke="rgba(240,162,109,0.25)"/>
        <text x="272" y="24" fill="#f0a26d" font-family="sans-serif" font-size="10">SOLDE ÉNERGIE</text>
        <text x="272" y="46" fill="#f0a26d" font-family="sans-serif" font-size="16" font-weight="bold">18 450 F</text>
      </g>

      <!-- Energy Histogram chart -->
      <g transform="translate(30, 215)">
        <text x="0" y="0" fill="#7d919a" font-family="sans-serif" font-size="11">Historique horaire (Capteurs IoT)</text>
        <!-- Grid lines -->
        <line x1="0" y1="20" x2="380" y2="20" stroke="rgba(255,255,255,0.06)"/>
        <line x1="0" y1="70" x2="380" y2="70" stroke="rgba(255,255,255,0.06)"/>
        <line x1="0" y1="120" x2="380" y2="120" stroke="rgba(255,255,255,0.12)"/>

        <!-- Bars -->
        <rect x="15" y="65" width="22" height="55" rx="3" fill="rgba(56,239,125,0.4)"/>
        <rect x="55" y="45" width="22" height="75" rx="3" fill="rgba(56,239,125,0.55)"/>
        <rect x="95" y="30" width="22" height="90" rx="3" fill="#38ef7d"/>
        <rect x="135" y="55" width="22" height="65" rx="3" fill="rgba(56,239,125,0.45)"/>
        <rect x="175" y="80" width="22" height="40" rx="3" fill="rgba(56,239,125,0.3)"/>
        <rect x="215" y="40" width="22" height="80" rx="3" fill="rgba(240,162,109,0.7)"/>
        <rect x="255" y="20" width="22" height="100" rx="3" fill="#f0a26d"/>
        <rect x="295" y="50" width="22" height="70" rx="3" fill="rgba(56,239,125,0.5)"/>
        <rect x="335" y="35" width="22" height="85" rx="3" fill="#38ef7d"/>

        <text x="15" y="140" fill="#52646d" font-family="monospace" font-size="10">06h</text>
        <text x="95" y="140" fill="#52646d" font-family="monospace" font-size="10">10h</text>
        <text x="175" y="140" fill="#52646d" font-family="monospace" font-size="10">14h</text>
        <text x="255" y="140" fill="#52646d" font-family="monospace" font-size="10">18h (Pic)</text>
        <text x="335" y="140" fill="#52646d" font-family="monospace" font-size="10">22h</text>
      </g>
    </g>

    <!-- Right side: USSD Mobile Interface & Twilio Gateway -->
    <g transform="translate(515, 85)">
      <!-- Feature phone / USSD device mockup -->
      <rect width="285" height="395" rx="20" fill="#080e11" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
      
      <!-- Screen container -->
      <rect x="20" y="24" width="245" height="347" rx="10" fill="#031014" stroke="#0e2a33" stroke-width="1.5"/>

      <!-- Status Bar -->
      <text x="32" y="46" fill="#38ef7d" font-family="monospace" font-size="10">TELCO 4G</text>
      <text x="205" y="46" fill="#8ca0a8" font-family="monospace" font-size="10">100%</text>

      <!-- USSD Dialog Box -->
      <g transform="translate(32, 65)">
        <rect width="221" height="235" rx="8" fill="#0e232b" stroke="#38ef7d" stroke-width="1"/>
        
        <text x="14" y="26" fill="#38ef7d" font-family="monospace" font-size="11" font-weight="bold">#144*8# - SmartWatt</text>
        <line x1="14" y1="35" x2="207" y2="35" stroke="rgba(56,239,125,0.3)"/>

        <text x="14" y="58" fill="#d2e3e8" font-family="monospace" font-size="10">Bienvenue sur SmartWatt</text>
        <text x="14" y="80" fill="#8ca0a8" font-family="monospace" font-size="10">1. Consulter solde KWh</text>
        <text x="14" y="100" fill="#8ca0a8" font-family="monospace" font-size="10">2. Recharger compteur</text>
        <text x="14" y="120" fill="#8ca0a8" font-family="monospace" font-size="10">3. Coupure d urgence</text>
        <text x="14" y="140" fill="#8ca0a8" font-family="monospace" font-size="10">4. Alerte conso SMS</text>
        
        <!-- Input field -->
        <rect x="14" y="160" width="193" height="26" rx="4" fill="#051216" stroke="rgba(255,255,255,0.18)"/>
        <text x="22" y="177" fill="#ffffff" font-family="monospace" font-size="11">1_</text>

        <!-- USSD Action buttons -->
        <rect x="14" y="196" width="90" height="26" rx="4" fill="rgba(255,255,255,0.08)"/>
        <text x="35" y="213" fill="#8ca0a8" font-family="sans-serif" font-size="10">Annuler</text>

        <rect x="117" y="196" width="90" height="26" rx="4" fill="#38ef7d"/>
        <text x="138" y="213" fill="#081418" font-family="sans-serif" font-size="10" font-weight="bold">Envoyer</text>
      </g>

      <!-- Twilio integration badge -->
      <g transform="translate(32, 320)">
        <rect width="221" height="38" rx="6" fill="rgba(240,162,109,0.12)" stroke="rgba(240,162,109,0.3)"/>
        <circle cx="20" cy="19" r="5" fill="#f02849"/>
        <text x="34" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="500">Service USSD via Twilio API</text>
      </g>
    </g>
  </g>
</svg>
